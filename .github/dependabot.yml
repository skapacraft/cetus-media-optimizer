# Two graphs are worth watching here. Composer, because the Sentry SDK ships
# inside the released plugin and therefore runs on other people's sites. And the
# actions CI runs, which hold a token on every push and, in deploy.yml, the DSN
# secret as well.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the routine bumps, so the ones worth reading are
      # the ones left over. Sentry stays out of the group: it is the only
      # runtime dependency, and it is the one that talks to the network.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["sentry/*"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
